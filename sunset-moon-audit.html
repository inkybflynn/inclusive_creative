<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Private report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andada+Pro:wght@400;700&family=Sarabun:wght@400&family=Sen:wght@700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#f5f6f3; --surface:#ffffff; --sunk:#eaeeea; --ink:#1d2624; --muted:#56615e; --line:#d6dbd6;
  --accent:#1f5c55; --accent-ink:#ffffff; --accent-soft:#dcebe7;
  --serious:#a4231c; --serious-soft:#f6e1de; --moderate:#7d5200; --moderate-soft:#f5ead3;
  --later:#3f4b7a; --later-soft:#e3e6f2;
  --display:"Spectral", Georgia, "Times New Roman", serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#121716; --surface:#1a2120; --sunk:#202927; --ink:#e6ebe8; --muted:#a0aca8; --line:#34403d;
    --accent:#86cabd; --accent-ink:#0f1a18; --accent-soft:#1f3632;
    --serious:#f29b91; --serious-soft:#3a1f1c; --moderate:#e6bd6e; --moderate-soft:#352a14;
    --later:#b3bdf0; --later-soft:#252a44;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#121716; --surface:#1a2120; --sunk:#202927; --ink:#e6ebe8; --muted:#a0aca8; --line:#34403d;
  --accent:#86cabd; --accent-ink:#0f1a18; --accent-soft:#1f3632;
  --serious:#f29b91; --serious-soft:#3a1f1c; --moderate:#e6bd6e; --moderate-soft:#352a14;
  --later:#b3bdf0; --later-soft:#252a44;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;padding-inline:20px;padding-block:0 64px}
.wrap{max-width:760px;margin:0 auto}
a{color:var(--accent);text-underline-offset:3px}
a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:4px}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.2;text-wrap:balance;margin:0}
h1{font-size:clamp(2rem,6vw,2.9rem);letter-spacing:-.01em}
h2{font-size:1.65rem;margin-bottom:.5rem}
h3{font-size:1.15rem;margin-top:1.6rem;margin-bottom:.4rem}
p{margin:0 0 .9rem}
ul,ol{margin:0 0 1rem;padding-left:1.25rem;display:grid;gap:.5rem}
code{font-family:var(--mono);font-size:.86em;background:var(--sunk);padding:.08em .35em;border-radius:4px;overflow-wrap:anywhere}
.eyebrow{font-family:var(--mono);font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
header.top{padding-block:48px 28px;border-bottom:1px solid var(--line);display:grid;gap:14px}
.meta{display:flex;flex-wrap:wrap;gap:8px 24px;font-size:.92rem;color:var(--muted)}
.meta b{color:var(--ink);font-weight:600}
.url{font-family:var(--mono);font-size:.95rem;color:var(--muted);overflow-wrap:anywhere}
section.sec{padding-block:40px 8px}
.lead{font-size:1.08rem}
.note{font-size:.9rem;color:var(--muted)}
/* scorecard */
.score{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:18px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:grid;gap:4px;align-content:start}
.tile .k{font-family:var(--mono);font-size:.75rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.tile .n{font-family:var(--display);font-size:2.1rem;line-height:1.1;font-variant-numeric:tabular-nums}
.tile .d{font-size:.9rem;color:var(--muted);line-height:1.45}
.sev{display:inline-block;font-family:var(--mono);font-size:.72rem;padding:.1em .5em;border-radius:99px;margin-right:4px}
.sev.s{background:var(--serious-soft);color:var(--serious)}
.sev.m{background:var(--moderate-soft);color:var(--moderate)}
/* top issues */
ol.issues{counter-reset:i;list-style:none;padding:0;gap:0;border-top:1px solid var(--line)}
ol.issues li{display:grid;grid-template-columns:2rem 1fr;gap:10px;padding-block:14px;border-bottom:1px solid var(--line)}
ol.issues li::before{counter-increment:i;content:counter(i);font-family:var(--display);font-size:1.3rem;color:var(--accent);line-height:1.3}
/* gate */
.gate{margin-top:44px;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.gate-head{padding:26px 26px 6px}
.contents{list-style:none;padding:0 26px;margin:14px 0 0;gap:0}
.contents li{display:flex;justify-content:space-between;gap:16px;padding-block:10px;border-top:1px dashed var(--line);font-size:.96rem}
.contents li span:last-child{color:var(--muted);font-family:var(--mono);font-size:.82rem;text-align:right;white-space:nowrap}
.pay{display:grid;grid-template-columns:1fr 1fr;gap:0;margin-top:22px;border-top:1px solid var(--line);background:var(--sunk)}
.pay > div{padding:22px 26px;display:grid;gap:10px;align-content:start}
.pay > div + div{border-left:1px solid var(--line)}
.price{font-family:var(--display);font-size:2.4rem;line-height:1}
.handle{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.handle output{font-family:var(--mono);font-size:1.05rem;background:var(--surface);border:1px solid var(--line);padding:.3em .6em;border-radius:6px;user-select:all}
.btn{appearance:none;border:0;border-radius:8px;padding:.7em 1.1em;font:600 .95rem/1 var(--body);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;min-height:44px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);min-height:36px;padding:.45em .8em;font-size:.85rem}
label{font-weight:600;font-size:.95rem}
.hint{font-size:.85rem;color:var(--muted);margin:0}
input[type=text]{font:500 1.05rem var(--mono);letter-spacing:.06em;text-transform:uppercase;width:100%;padding:.65em .75em;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row input{flex:1 1 180px}
.status{min-height:1.4em;font-size:.9rem;margin:0}
.status.err{color:var(--serious)}
.status.ok{color:var(--accent)}
/* unlocked report */
.tablewrap{overflow-x:auto;margin:14px 0 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.92rem;min-width:560px}
caption{text-align:left;padding:10px 14px;color:var(--muted);font-size:.85rem;caption-side:top}
th,td{text-align:left;vertical-align:top;padding:10px 14px;border-top:1px solid var(--line)}
thead th{font-family:var(--mono);font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500;background:var(--sunk);border-top:0}
tbody th{font-weight:600}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.pri{font-family:var(--mono);font-size:.74rem;padding:.15em .55em;border-radius:99px;white-space:nowrap}
.p1{background:var(--serious-soft);color:var(--serious)}
.p2{background:var(--moderate-soft);color:var(--moderate)}
.p3{background:var(--later-soft);color:var(--later)}
.unlocked-banner{margin-top:44px;padding:14px 18px;border-radius:10px;background:var(--accent-soft);font-size:.95rem}
footer{margin-top:56px;padding-top:18px;border-top:1px solid var(--line);font-size:.85rem;color:var(--muted)}
@media (max-width:620px){
  .pay{grid-template-columns:1fr}
  .pay > div + div{border-left:0;border-top:1px solid var(--line)}
  .gate-head,.contents{padding-inline:18px}
  .pay > div{padding:20px 18px}
  .contents li{flex-direction:column;gap:2px}
  .contents li span:last-child{text-align:left;white-space:normal}
}
@media (prefers-reduced-motion:no-preference){ #report{animation:none} }
</style><style>
.skip{position:absolute;left:-9999px;top:8px;background:var(--accent);color:var(--accent-ink);padding:.5em .9em;border-radius:6px;z-index:10}
.skip:focus{left:16px}
a.gl{color:inherit;text-decoration:underline dotted;text-decoration-color:var(--accent);text-underline-offset:3px;text-decoration-thickness:2px}
a.gl:hover{color:var(--accent)}
nav.toc{margin-top:28px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 22px}
nav.toc ol{margin:.5rem 0 0;gap:.3rem}
.box{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin:16px 0}
.box h3{margin-top:0}
.fix{border-top:1px solid var(--line);padding-block:26px 6px}
.fix:first-of-type{border-top:0}
.fix h3{margin-top:0;font-size:1.3rem}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:.4rem 0 .9rem}
.tag{font-family:var(--mono);font-size:.74rem;padding:.2em .6em;border-radius:99px;background:var(--sunk);color:var(--muted)}
.tag.you{background:var(--accent-soft);color:var(--accent)}
.tag.host{background:var(--moderate-soft);color:var(--moderate)}
.tag.dev{background:var(--later-soft);color:var(--later)}
.label{font-family:var(--mono);font-size:.75rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:1rem 0 .3rem;display:block}
ol.steps{counter-reset:s;list-style:none;padding:0;gap:.6rem}
ol.steps > li{display:grid;grid-template-columns:1.8rem minmax(0,1fr);gap:8px}
ol.steps > li::before{counter-increment:s;content:counter(s);font-family:var(--mono);font-size:.8rem;width:1.6rem;height:1.6rem;border-radius:99px;display:grid;place-items:center;background:var(--sunk);color:var(--ink);margin-top:.1rem}
.path{overflow-wrap:anywhere;font-family:var(--mono);font-size:.88em;background:var(--sunk);padding:.05em .4em;border-radius:4px}
.example{border-left:3px solid var(--accent);padding:.4rem 0 .4rem 1rem;margin:.6rem 0 1rem;color:var(--ink)}
dl.gloss{display:grid;gap:0;margin:0}
dl.gloss > div{padding-block:14px;border-top:1px solid var(--line);scroll-margin-top:16px}
dl.gloss > div:target{background:var(--accent-soft);padding-inline:12px;border-radius:8px}
dl.gloss dt{font-weight:700;font-family:var(--display);font-size:1.08rem}
dl.gloss dd{margin:.25rem 0 0}
.top-link{font-size:.85rem}
</style>
<style>
.compare{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin:18px 0 6px}
.compare figure{margin:0;display:grid;gap:8px;align-content:start}
.compare figcaption{font-size:.92rem}
.demo{border-radius:10px;padding:28px 22px;display:grid;gap:10px;min-height:190px;align-content:center}
.demo-bad{background:linear-gradient(135deg,#c9b6e4,#f1c4d6);text-align:center;color:#fff;text-shadow:0 1px 2px rgba(120,90,140,.5)}
.demo-bad .demo-h{font-family:var(--display);font-size:1.6rem;letter-spacing:.08em}
.demo-bad .demo-p{font-style:italic}
.demo-good{background:#fbf8fc;color:#2b1f33;border:1px solid #e6dcec}
.demo-good .demo-h{font-family:var(--display);font-size:1.6rem;font-weight:600}
.demo-btn{justify-self:start;background:#5b3a73;color:#fff;border-radius:8px;padding:.55em 1em;font-weight:600;font-size:.92rem}
ol.rules{padding-left:1.4rem;gap:.8rem}
.flow{margin:18px 0 8px}
.flowwrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.flowwrap svg{display:block;width:100%;min-width:640px;max-width:780px;height:auto;margin:0 auto}
.fc-node{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.fc-start{fill:var(--sunk);stroke:var(--line);stroke-width:1.5}
.fc-goal{fill:var(--accent);stroke:var(--accent)}
.fc-end{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.5}
.fc-line{stroke:var(--muted);stroke-width:1.5;fill:none}
.fc-arrowhead{fill:var(--muted)}
.fc-t{fill:var(--ink);font-family:var(--body);font-size:13px}
.fc-b{font-weight:700;font-size:14px}
.fc-s{fill:var(--muted);font-size:12px}
.fc-goal-t{fill:var(--accent-ink)}
.paths-text h4{font-family:var(--display);font-size:1.02rem;margin:1rem 0 .4rem}
</style>

<style>
.ds-h4{font-family:var(--display);font-size:1.02rem;margin:1.4rem 0 .5rem}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.sw{display:grid;gap:3px;align-content:start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 10px 12px}
.chip{display:block;height:64px;border-radius:6px;margin-bottom:6px}
.chip-line{box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.sw-name{font-weight:700}
.sw-hex{font-family:var(--mono);font-size:.85rem}
.sw-role{font-size:.88rem;color:var(--muted);line-height:1.4}
.sw-pass{font-family:var(--mono);font-size:.78rem;color:var(--accent)}
.sunset-band{height:14px;border-radius:99px;margin:16px 0 6px;background:linear-gradient(90deg,#C7A9CB,#E2AABE,#F4B99D)}
.type-specimens{display:grid;gap:12px;margin:12px 0}
.spec{display:grid;gap:6px;background:#FFFFFF;border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.spec-role{font-family:var(--mono);font-size:.74rem;letter-spacing:.07em;text-transform:uppercase;color:#5E5268}
.spec-meta{font-size:.88rem;color:#5E5268}
.spec-btn{display:inline-flex;align-items:center;min-height:44px;padding:0 20px;border-radius:6px;background:#492769;color:#fff;font-family:Sen,system-ui,sans-serif;font-weight:700;font-size:16px;text-transform:uppercase;letter-spacing:.04em}
.spec-btn-2{background:#fff;color:#492769;box-shadow:inset 0 0 0 2px #492769}
.btn-demo{display:flex;flex-wrap:wrap;gap:12px;background:#FFFFFF;border:1px solid var(--line);border-radius:10px;padding:18px;margin:10px 0 14px}
</style>
<style>
.sidenav-panel ol{list-style:none;padding:0;margin:.4rem 0 .8rem;gap:2px;counter-reset:none}
.sidenav-panel a{display:block;padding:.35em .6em;border-radius:6px;color:var(--ink);text-decoration:none;font-size:.9rem;line-height:1.3;border-left:3px solid transparent}
.sidenav-panel a:hover{background:var(--sunk)}
.sidenav-panel a[aria-current="true"]{border-left-color:var(--accent);background:var(--accent-soft);color:var(--ink);font-weight:600}
.sidenav-title{font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-left:.6em}
.sidenav-panel .sidenav-top{font-size:.82rem;color:var(--accent)}
.sidenav-toggle{display:none}
@media (min-width:1180px){
  .sidenav{position:fixed;top:calc(env(safe-area-inset-top,0px) + 32px);left:max(16px,calc(50% - 380px - 250px));width:220px;max-height:calc(100vh - 64px);overflow:auto;z-index:5}
  .sidenav-panel{display:block!important;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 10px}
}
@media (max-width:1179px){
  .sidenav{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;display:grid;justify-items:end;gap:8px}
  .sidenav-toggle{display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:0 18px;border:0;border-radius:99px;background:var(--accent);color:var(--accent-ink);font:600 .95rem var(--body);box-shadow:0 6px 18px rgba(0,0,0,.18);cursor:pointer;order:2}
  .sidenav-toggle::before{content:"";width:14px;height:10px;background:linear-gradient(currentColor 0 0) 0 0/100% 2px no-repeat,linear-gradient(currentColor 0 0) 0 50%/100% 2px no-repeat,linear-gradient(currentColor 0 0) 0 100%/100% 2px no-repeat}
  .sidenav-panel{display:none;order:1;width:min(280px,calc(100vw - 32px));max-height:calc(100vh - 120px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 8px;box-shadow:0 10px 30px rgba(0,0,0,.2)}
  .sidenav.open .sidenav-panel{display:block}
  footer{padding-bottom:64px}
}
@media print{.sidenav{display:none}}
</style>
</head>
<body>
<style>
.lock{max-width:440px;margin:12vh auto 0;display:grid;gap:14px}
.lock h1{font-size:2rem}
.lock form{display:grid;gap:8px}
.lock input{font:500 1.05rem var(--mono);letter-spacing:.06em;width:100%;padding:.65em .75em;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
</style>
<div class="wrap" id="lockwrap">
  <main class="lock" id="lock">
    <span class="eyebrow">Inclusive Creative</span>
    <h1>Private report</h1>
    <p>This report is password protected. Enter the password you were given.</p>
    <form id="unlock" novalidate>
      <label for="pw">Password</label>
      <input type="password" id="pw" name="pw" autocomplete="off" spellcheck="false" aria-describedby="status">
      <button class="btn primary" type="submit" id="go">Open report</button>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </form>
    <noscript><p>This report needs JavaScript turned on to open.</p></noscript>
  </main>

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const norm=s=>s.toUpperCase().replace(/[^A-Z0-9]/g,"");
async function decrypt(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(norm(pw)),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(LOCKED.salt),iterations:LOCKED.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(LOCKED.iv)},key,b64(LOCKED.ct)));
}
function initNav(){
  const nav=document.getElementById("sidenav"); if(!nav) return;
  const btn=document.getElementById("sidenav-toggle"), links=[...nav.querySelectorAll("ol a")];
  const close=(f)=>{nav.classList.remove("open");btn.setAttribute("aria-expanded","false");if(f)btn.focus();};
  btn.addEventListener("click",()=>{const o=nav.classList.toggle("open");btn.setAttribute("aria-expanded",String(o));if(o)links[0].focus();});
  nav.addEventListener("keydown",e=>{if(e.key==="Escape"&&nav.classList.contains("open"))close(true);});
  document.addEventListener("click",e=>{if(nav.classList.contains("open")&&!nav.contains(e.target))close(false);});
  links.forEach(a=>a.addEventListener("click",()=>{if(getComputedStyle(btn).display!=="none")close(false);}));
  const secs=links.map(a=>document.getElementById(a.hash.slice(1))).filter(Boolean);
  const mark=()=>{let cur=secs[0];for(const s of secs){if(s.getBoundingClientRect().top<=140)cur=s;}links.forEach(a=>a.hash.slice(1)===cur.id?a.setAttribute("aria-current","true"):a.removeAttribute("aria-current"));};
  addEventListener("scroll",mark,{passive:true});mark();
}
function open(html,focus){
  document.getElementById("lockwrap").outerHTML=html;initNav();
  {const h=document.querySelector("h1");if(h)document.title=h.textContent.trim()+" audit";}
  if(focus){const h=document.querySelector("h1");if(h){h.setAttribute("tabindex","-1");h.focus();}}
  if(location.hash){const t=document.getElementById(location.hash.slice(1));if(t)t.scrollIntoView();}
}
const st=document.getElementById("status"),btn=document.getElementById("go");
document.getElementById("unlock").addEventListener("submit",async e=>{
  e.preventDefault();const pw=document.getElementById("pw").value;
  if(!norm(pw)){st.className="status err";st.textContent="Enter the password.";return;}
  btn.disabled=true;st.className="status";st.textContent="Checking…";
  try{const html=await decrypt(pw);try{sessionStorage.setItem("ic-pw",norm(pw));}catch(_){}open(html,true);}
  catch(_){st.className="status err";st.textContent="That password didn’t work. Check it for typos and try again.";btn.disabled=false;}
});
(async()=>{let s=null;try{s=sessionStorage.getItem("ic-pw");}catch(_){}if(s){try{open(await decrypt(s),false);}catch(_){}}})();
</script>
